<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 40px;
        }

        .form-box {
            background: white;
            padding: 30px;
            max-width: 500px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 15px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="form-box">

    <h1>{{ event.title }}</h1>

    <form method="post">
        {% csrf_token %}

        <input type="text" name="full_name" placeholder="ФИО" required>

        <input type="text" name="phone" placeholder="Телефон" required>

        <input type="email" name="email" placeholder="Email" required>

        <button type="submit">
            Зарегистрироваться
        </button>
    </form>

</div>

</body>
</html>
