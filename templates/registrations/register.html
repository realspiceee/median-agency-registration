<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация</title>

    <link href="https://fonts.cdnfonts.com/css/mont" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html,
        body{
            min-height:100%;
        }

        body{
            font-family:'Mont',sans-serif;

            background:#f4f5f7;

            color:#111111;

            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }

        a{
            text-decoration:none;
            color:inherit;
        }

        .page{
            min-height:100vh;

            display:flex;
            flex-direction:column;
        }

        .header{
            height:80px;

            background:white;

            border-bottom:1px solid #ececec;

            display:flex;
            align-items:center;
            justify-content:space-between;

            padding:0 28px;
        }

        .logo{
            font-size:23px;
            font-weight:600;

            letter-spacing:-0.8px;
        }

        .back-btn{
            height:42px;

            padding:0 18px;

            border-radius:14px;

            border:1px solid #ececec;

            background:white;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:14px;
            font-weight:500;

            transition:0.2s;
        }

        .back-btn:hover{
            background:#f7f7f7;
        }

        .wrapper{
            flex:1;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:40px 20px;
        }

        .ticket{
            width:100%;
            max-width:620px;

            background:white;

            border:1px solid #ececec;

            border-radius:28px;

            padding:42px;
        }

        .title{
            font-size:54px;

            line-height:1;

            font-weight:600;

            letter-spacing:-2px;

            margin-bottom:14px;
        }

        .subtitle{
            color:#7b7b7b;

            font-size:15px;

            line-height:1.7;

            margin-bottom:34px;
        }

        .form-list{
            display:flex;
            flex-direction:column;

            gap:20px;
        }

        .field{
            display:flex;
            flex-direction:column;
        }

        .label{
            font-size:14px;
            font-weight:500;

            margin-bottom:10px;
        }

        .input{
            width:100%;

            height:56px;

            border-radius:16px;

            border:1px solid #dddddd;

            background:white;

            padding:0 18px;

            font-size:15px;

            font-family:'Mont',sans-serif;

            transition:0.2s;
        }

        .input:focus{
            outline:none;

            border-color:#111111;
        }

        .submit-btn{
            width:100%;

            height:56px;

            border:none;

            border-radius:16px;

            background:#111111;

            color:white;

            font-size:15px;
            font-weight:500;

            font-family:'Mont',sans-serif;

            cursor:pointer;

            margin-top:10px;

            transition:0.2s;
        }

        .submit-btn:hover{
            background:#262626;
        }

        .agreement{
            margin-top:18px;

            color:#8a8a8a;

            font-size:13px;

            line-height:1.7;
        }

        .event-box{
            margin-top:34px;

            padding-top:26px;

            border-top:1px solid #ececec;
        }

        .event-label{
            color:#9a9a9a;

            font-size:13px;

            margin-bottom:10px;
        }

        .event-title{
            font-size:18px;

            font-weight:600;
        }

        @media(max-width:768px){

            .header{
                height:72px;

                padding:0 16px;
            }

            .logo{
                font-size:20px;
            }

            .back-btn{
                height:40px;

                padding:0 14px;

                font-size:13px;
            }

            .wrapper{
                padding:12px;
            }

            .ticket{
                border-radius:22px;

                padding:26px 20px;
            }

            .title{
                font-size:36px;

                letter-spacing:-1.2px;
            }

            .subtitle{
                font-size:14px;

                margin-bottom:26px;
            }

            .input{
                height:52px;

                border-radius:14px;
            }

            .submit-btn{
                height:52px;

                border-radius:14px;
            }

        }

    </style>

</head>

<body>

<div class="page">

    <header class="header">

        <div class="logo">
            Median Agency
        </div>

        <a href="/" class="back-btn">
            ← Назад
        </a>

    </header>

    <div class="wrapper">

        <div class="ticket">

            <h1 class="title">
                Регистрация
            </h1>

            <div class="subtitle">
                Заполните информацию для участия в мероприятии.
            </div>

            <form method="post">

                {% csrf_token %}

                <div class="form-list">

                    <div class="field">

                        <label class="label">
                            ФИО
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            class="input"
                            required>

                    </div>

                    <div class="field">

                        <label class="label">
                            Телефон
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="input"
                            required>

                    </div>

                    <div class="field">

                        <label class="label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="input"
                            required>

                    </div>

                </div>

                <button class="submit-btn">
                    Продолжить
                </button>

            </form>

            <div class="agreement">
                Нажимая кнопку «Продолжить», вы соглашаетесь
                на обработку персональных данных.
            </div>

            <div class="event-box">

                <div class="event-label">
                    Мероприятие
                </div>

                <div class="event-title">
                    {{ event.title }}
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
